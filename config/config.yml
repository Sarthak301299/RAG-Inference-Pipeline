# ============================================================
# RAG Inference Pipeline — Configuration
# ============================================================

project:
  name: rag-inference-pipeline
  log_level: INFO

# ------------------------------------------------------------
# VectorDB
# ------------------------------------------------------------

vectorDB:
  vdbname: qdrant # qdrant | chroma | pgvector
  vdbpath: vectorDB
  distance_metric: cosine # cosine | l2 | ip
  retrival_to_rerank_ratio: 10
  final_chunk_count: 5
  search_type: similarity # similarity | mmr | similarity_score_threshold

# ------------------------------------------------------------
# Ingestion
# ------------------------------------------------------------
ingestion:
  loading:
    source_dir: data/eval/agenttest

  chunking:
    strategy: auto # fixed | recursive | auto
    chunk_size: 512
    chunk_overlap: 64

  embedding:
    model: BAAI/bge-small-en-v1.5 # Any HuggingFace embedding model
    batch_size: 64
    normalize: "true"

# ------------------------------------------------------------
# Retrieval
# ------------------------------------------------------------
retrieval:
  reranker:
    model: cross-encoder/ms-marco-MiniLM-L6-v2 # Any HuggingFace Cross-Encoder
    batch_size: 64

# ------------------------------------------------------------
# Generation
# ------------------------------------------------------------
generation:
  backend: vllm
  model: Qwen/Qwen2.5-Coder-1.5B-Instruct # Any HuggingFace generation model
  vllm:
    temperature: 0.1
    max_num_seqs: 256
    max_num_batched_tokens: 2048
    max_tokens: 4096
    top_p: 0.95
  tensorrt:
    compile_dir: .tensorrtcache

# ------------------------------------------------------------
# Evaluation
# ------------------------------------------------------------
eval:
  dataset_path: data/eval/codesearchnet/qa_set.jsonl
  k_values: [3, 5]
  output_dir: results/eval
  codesearchnet:
    output_dir: data/eval/codesearchnet # corpus/ and qa_set.jsonl written here
    dataset_name: code-search-net/code_search_net
    config_name: python # language subset
    split: test
    num_examples: 20
    seed: 42
    # Field names as of the current Hugging Face schema -- override if the
    # dataset's column names change:
    docstring_field: func_documentation_string
    code_field: func_code_string
    path_field: func_path_in_repository

# ------------------------------------------------------------
# RAG
# ------------------------------------------------------------
rag:
  max_thought_process_words: 200
  max_answer_words: 3000

# ------------------------------------------------------------
# Agent
# ------------------------------------------------------------
agent:
  max_iterations: 6
  max_thought_len: 2500 # Maximum number of characters in the agent's output for thought process
  max_action_input_len: 5000 # Maximum number of characters in the agent's output for action input field
