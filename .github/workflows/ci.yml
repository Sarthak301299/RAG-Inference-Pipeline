name: RAG Inference CI Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        name: Basic Python Tests
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository code
              uses: actions/checkout@v7
            - name: Setup uv
              uses: astral-sh/setup-uv@v8.3.2
              with:
                  version: "0.11.28"
                  enable-cache: true
            - name: Install dependencies
              run: uv sync --locked --extra cpu --dev
            - name: Static Formatting Check
              uses: psf/black@stable
              with:
                  options: "--check --diff"
                  src: "src tests"
            - name: Lint check
              uses: astral-sh/ruff-action@v4.0.0
              with:
                  src: "src tests"
            - name: Type check
              uses: jakebailey/pyright-action@v3
            - name: Unit & Coverage Tests
              run: uv run pytest --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=80
            - name: Security Audit
              run: uv audit
