[project]
name = "rag-inference-pipeline"
version = "0.1.0"
description = "A RAG inference pipeline with a coding agent layer."
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "fastapi>=0.133.0,<0.137.0",
    "torch",
    "torchvision",
    "torchaudio",
    "torchcodec",
    "uv",
    "uvicorn>=0.51.0",
    "langchain-text-splitters>=1.1.2",
    "langchain-qdrant>=1.1.0",
    "langchain-chroma>=1.1.0",
    "langchain-postgres>=0.0.17",
    "langchain-huggingface>=1.2.2",
    "pgembed>=0.2.0",
    "langchain-unstructured>=1.0.1",
    "vllm==0.26.0",
    "sentence-transformers>=5.6.1",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
torchcodec = { index = "pytorch-cu129" }
vllm = { url = "https://github.com/vllm-project/vllm/releases/download/v0.26.0/vllm-0.26.0+cu129-cp38-abi3-manylinux_2_28_x86_64.whl" }

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.[^/]+|
    build|
    dist|
    \.venv|
    env|
    venv|
    __pycache__|
    .pytest_cache|
    .git|
    .github
)/
'''

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "locust>=2.46.2",
    "pre-commit>=4.6.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]
